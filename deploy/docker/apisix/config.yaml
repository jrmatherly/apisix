# APISIX config for the deploy/docker stack. Secrets come from the
# environment (.env): the admin key and every provider key are read at
# start-up, never written here.
apisix:
  node_listen: 9080
  enable_ipv6: false

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: admin
        key: ${{APISIX_ADMIN_KEY}}
        role: admin
    enable_admin_ui: true
  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30

nginx_config:
  # Env vars that routes may reference as $env://NAME (see docs/ai-gateway.md).
  envs:
    - OPENAI_AUTHORIZATION
    - ANTHROPIC_API_KEY
    - AZURE_OPENAI_API_KEY
    - LOCAL_LLM_AUTHORIZATION
    - DEMO_CONSUMER_KEY

plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
